appId: com.fitforge.app
---
- launchApp
- assertVisible: "Sign In"
- tapOn: "Email"
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn: "Password"
- inputText: ${MAESTRO_TEST_PASSWORD}
- tapOn: "Sign In"
- assertVisible: "My Workouts"
- tapOn: "Profile tab"
- assertVisible: "Subscription"
- tapOn: "Upgrade to Pro"
- assertVisible: "Purchase Pro"
