server:
  port: 8081

spring:
  application:
    name: fitforge-subscriptions
  datasource:
    url: jdbc:postgresql://localhost:5432/fitforge
    username: fitforge
    password: fitforge
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: warn
    com.fitforge.subscriptions: info