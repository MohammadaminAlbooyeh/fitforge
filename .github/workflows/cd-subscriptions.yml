# Builds and publishes the subscriptions Docker image to GitHub Container
# Registry on every push to main. See cd-backend.yml for notes on the
# placeholder deploy step.
name: CD - Subscriptions

on:
  push:
    branches: [main]
    paths:
      - 'subscriptions/**'
      - '.github/workflows/cd-subscriptions.yml'
  workflow_dispatch: {}

concurrency:
  group: cd-subscriptions
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/subscriptions

jobs:
  test:
    uses: ./.github/workflows/subscriptions-ci.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./subscriptions
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Deploy
        run: |
          echo "TODO: deploy ${{ env.IMAGE_NAME }}:${{ github.sha }} to the target environment."
