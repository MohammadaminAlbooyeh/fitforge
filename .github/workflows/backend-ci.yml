name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_call: {}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitforge
          POSTGRES_PASSWORD: fitforge
          POSTGRES_DB: fitforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Check for model/migration drift
        env:
          DATABASE_URL: postgresql+psycopg://fitforge:fitforge@localhost:5432/fitforge
          DEBUG: "true"
        run: |
          alembic upgrade head
          alembic check