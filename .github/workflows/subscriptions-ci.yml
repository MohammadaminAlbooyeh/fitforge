name: Subscriptions CI

on:
  push:
    branches: [main]
    paths:
      - 'fitforge-subscriptions/**'
  pull_request:
    branches: [main]
    paths:
      - 'fitforge-subscriptions/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitforge-subscriptions

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn -B test