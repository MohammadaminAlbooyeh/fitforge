server:
  port: 8081

spring:
  application:
    name: fitforge-subscriptions
  datasource:
    url: jdbc:postgresql://localhost:5432/fitforge
    username: ${SPRING_DATASOURCE_USERNAME:fitforge}
    password: ${SPRING_DATASOURCE_PASSWORD:fitforge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true

logging:
  level:
    org.hibernate.SQL: warn
    com.fitforge.subscriptions: info

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    enabled: ${OTEL_ENABLED:false}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
